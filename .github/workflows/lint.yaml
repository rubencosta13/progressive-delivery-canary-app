name: Lint
on:
  pull_request:
    paths:
      - 'src/**'

  push:
    branches:
      - main
    paths:
      - 'src/**'


jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Oxlint
        run: yarn run lint